<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loot Crate Demo - Premium Editie</title>
    <style>
        /* Importeren van een modern, clean font */
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');

        /* -------------------------------------
           1. Algemene Vormgeving
           ------------------------------------- */
        body {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #0B0F19 0%, #050505 100%);
            color: #E2E8F0;
            overflow: hidden;
            /* Geen scrollbars */
        }

        /* Subtiele achtergrond grid effect of deeltjes voor die 'hacker/game' feel */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(rgba(251, 191, 36, 0.05) 1px, transparent 1px),
                radial-gradient(rgba(251, 191, 36, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            z-index: -1;
            opacity: 0.5;
        }

        /* Titels bovenaan (Optioneel, voor sfeer) */
        .title-container {
            position: absolute;
            top: 5vh;
            text-align: center;
            text-shadow: 0 0 20px rgba(76, 29, 149, 0.8);
        }

        .title-container h1 {
            font-size: 3rem;
            margin: 0;
            color: #E2E8F0;
            letter-spacing: 5px;
            font-weight: 900;
        }

        .title-container h1 span {
            color: #FBBF24;
            text-shadow: 0 0 15px rgba(251, 191, 36, 0.6);
        }

        .title-container p {
            color: #a0aec0;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        /* -------------------------------------
           2. 3D Card / Loot Crate Setup
           ------------------------------------- */
        .scene {
            width: 320px;
            height: 450px;
            perspective: 1200px;
            /* Het 3D canvas (cruciaal!) */
            margin-bottom: 50px;
            z-index: 10;
        }

        /* De zweef-animatie van de gehele kaart */
        @keyframes floating {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-20px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            /* De "bounce" in de flip */
            cursor: pointer;
            animation: floating 4s ease-in-out infinite;
        }

        /* De magische transform-class om om te draaien */
        .card.is-flipped {
            transform: rotateY(180deg);
        }

        /* Styling van beide kanten (voor en achter) */
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            /* Voorkomt dat je de tekst in spiegelbeeld ziet */
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            border: 3px solid #FBBF24;
            /* Basis gloed om de kist heen! */
            box-shadow: 0 0 30px rgba(76, 29, 149, 0.6),
                inset 0 0 20px rgba(76, 29, 149, 0.8);
        }

        /* -------------------------------------
           3. De Voorkant (Gesloten Crate)
           ------------------------------------- */
        .card-front {
            /* Paarse/magische gradient */
            background: linear-gradient(135deg, #2D1B4E, #4C1D95);
            /* Een lichte patroon laag erop voor textuur */
            background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(0, 0, 0, 0.1) 10px, rgba(0, 0, 0, 0.1) 20px), linear-gradient(135deg, #2D1B4E, #4C1D95);
        }

        /* Het grote gouden vraagteken of logo */
        .card-front::after {
            content: '?';
            font-size: 150px;
            font-weight: 900;
            color: #FBBF24;
            text-shadow:
                0 0 20px rgba(251, 191, 36, 0.8),
                0 0 40px rgba(251, 191, 36, 0.4);
            animation: pulse-glow 2s infinite;
        }

        @keyframes pulse-glow {
            0% {
                transform: scale(1);
                text-shadow: 0 0 20px rgba(251, 191, 36, 0.8);
            }

            50% {
                transform: scale(1.05);
                text-shadow: 0 0 40px rgba(251, 191, 36, 1);
            }

            100% {
                transform: scale(1);
                text-shadow: 0 0 20px rgba(251, 191, 36, 0.8);
            }
        }

        /* -------------------------------------
           4. De Achterkant (Het Resultaat)
           ------------------------------------- */
        .card-back {
            transform: rotateY(180deg);
            /* Een diepe, zwarte "void" voor de onthulling */
            background: radial-gradient(circle at center, #1a1a2e, #050505);
            /* Bij flip krijgt de achterkant een gouden gloed ipv paars! */
            box-shadow: 0 0 50px rgba(251, 191, 36, 0.5),
                inset 0 0 40px rgba(251, 191, 36, 0.3);
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .card-back p {
            color: #a0aec0;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        /* De uiteindelijke game text die extreem opvalt */
        .card-back h2 {
            color: #FBBF24;
            font-size: 2.5rem;
            margin: 0;
            line-height: 1.1;
            text-shadow:
                0 0 10px rgba(251, 191, 36, 0.8),
                0 0 30px rgba(251, 191, 36, 0.5);
        }

        /* -------------------------------------
           5. De Knoppen Sectie
           ------------------------------------- */
        .action-area {
            display: flex;
            gap: 20px;
            z-index: 10;
        }

        .btn {
            background: linear-gradient(45deg, #4C1D95, #2D1B4E);
            color: #ffffff;
            border: 2px solid #FBBF24;
            border-radius: 30px;
            /* Pill shape */
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(76, 29, 149, 0.6);
            font-family: inherit;
        }

        .btn:hover {
            transform: scale(1.05) translateY(-3px);
            background: linear-gradient(45deg, #5b21b6, #4C1D95);
            /* De perfecte gouden gloed bij hover! */
            box-shadow: 0 10px 25px rgba(251, 191, 36, 0.5);
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* Tweede knop (Accepteren) is 'Ghosted' (minder opvallend) */
        .btn-ghost {
            background: transparent;
            border: 2px solid #4C1D95;
            color: #E2E8F0;
            box-shadow: none;
            display: none;
            /* Verborgen tot we flippen */
        }

        .btn-ghost:hover {
            background: rgba(76, 29, 149, 0.2);
            border-color: #FBBF24;
            color: #FBBF24;
            box-shadow: none;
        }

        /* Magisch confetti deeltjes effect element (Verborgen) */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #FBBF24;
            opacity: 0;
        }
    </style>
</head>

<body>

    <div class="title-container">
        <h1>GAME ROULETTE</h1>
        <p>Unbox je volgende avontuur</p>
    </div>

    <!-- 1. Het 3D Canvas / De Scene -->
    <div class="scene">
        <div class="card" id="lootbox">

            <!-- Voorkant: De mysterieuze paarse kist met goudkleurig detail -->
            <div class="card-face card-front"></div>

            <!-- Achterkant: De winnaar -->
            <div class="card-face card-back">
                <p>Jouw game wordt:</p>
                <h2 id="winner-text">Loading...</h2>
            </div>
        </div>
    </div>

    <!-- 2. De Knoppen -->
    <div class="action-area">
        <button class="btn" id="reveal-btn">REVEAL GAME</button>
        <button class="btn btn-ghost" id="accept-btn">ACCEPTEER</button>
    </div>

    <!-- 3. De JavaScript Logica -->
    <script>
        // De benodigde HTML elementen ophalen
        const card = document.getElementById('lootbox');
        const revealBtn = document.getElementById('reveal-btn');
        const acceptBtn = document.getElementById('accept-btn');
        const winnerText = document.getElementById('winner-text');

        // Test Data (Zodat de demo werkt zonder de echte games.js in te laden)
        const demoGames = [
            "The Witcher 3: Wild Hunt",
            "Cyberpunk 2077",
            "Elden Ring",
            "Red Dead Redemption 2",
            "Baldur's Gate 3",
            "DOOM Eternal"
        ];

        let isFlipping = false;
        let isRevealed = false;

        // "REVEAL GAME" Knop Logica
        revealBtn.addEventListener('click', () => {
            if (isFlipping || isRevealed) return; // Spam-click voorkomen
            isFlipping = true;

            // 1. Kies een random game uit de array
            const randomIndex = Math.floor(Math.random() * demoGames.length);
            const chosenGame = demoGames[randomIndex];

            // 2. Pas de tekst aan op de achterkant (nog onzichtbaar voor de user!)
            winnerText.innerText = chosenGame;

            // 3. Draai de kaart om en wissel de knoppen
            card.classList.add('is-flipped');

            // Knop wisselen exact nadat de flip voor de helft is (0.6 sec van de 1.2s totaal)
            setTimeout(() => {
                revealBtn.style.display = 'none';
                acceptBtn.style.display = 'block';
                isRevealed = true;
                isFlipping = false;

                // Optioneel: speel een triomfantelijk geluidje af of sproei CSS confetti!
            }, 600);
        });

        // "ACCEPTEER" Knop Logica (Spel opslaan en terug gaan)
        acceptBtn.addEventListener('click', () => {
            if (isFlipping) return;
            isFlipping = true;

            // 1. Draai de kaart terug naar gesloten status
            card.classList.remove('is-flipped');

            // 2. Herstel de orginele "REVEAL" knop layout
            setTimeout(() => {
                acceptBtn.style.display = 'none';
                revealBtn.style.display = 'block';
                winnerText.innerText = "Loading...";
                isRevealed = false;
                isFlipping = false;
            }, 600);
        });

        // Klikken op de kaart zelf is optioneel ook een manier om een reveal te simuleren!
        card.addEventListener('click', () => {
            if (!isRevealed) revealBtn.click();
        });
    </script>
</body>

</html>
